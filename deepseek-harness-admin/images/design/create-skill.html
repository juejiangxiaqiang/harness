<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>创建技能 - Harness 管理后台</title>
  <!-- 共享设计令牌与组件样式 -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 应用外壳：左侧固定侧边栏 + 右侧主内容区 -->
  <div class="app">

    <!-- ===================== 侧边栏 ===================== -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo"></div>
        <div class="brand-text">
          <span class="brand-name">Harness 管理后台</span>
          <span class="brand-tag">数字员工</span>
        </div>
      </div>

      <!-- 导航菜单：Skills 为当前选中 -->
      <nav class="nav">
        <div class="nav-group-title">资源管理</div>
        <a class="nav-item" href="knowledge-base.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          知识库
        </a>
        <a class="nav-item" href="create-skill.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          技能
        </a>
        <a class="nav-item" href="employees.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          数字员工
        </a>

        <div class="nav-sep"></div>
        <div class="nav-group-title">发布管理</div>
        <a class="nav-item" href="employee-preview.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          发布与预览
        </a>
      </nav>

      <div class="user-area">
        <div class="avatar avatar-blue">管</div>
        <div class="user-info">
          <div class="user-name">管理员</div>
          <div class="user-role">admin@harness</div>
        </div>
        <a class="logout-link" href="login.html">退出</a>
      </div>
    </aside>

    <!-- ===================== 主内容区 ===================== -->
    <main class="main">
      <!-- 面包屑导航 -->
      <div class="breadcrumb">
        Harness 管理后台 <span class="sep">/</span> 资源管理 <span class="sep">/</span> 技能 <span class="sep">/</span> <span class="current">创建技能</span>
      </div>

      <!-- 页面标题 -->
      <div class="page-header">
        <div>
          <h1>创建技能</h1>
          <p class="page-sub">填写技能信息并关联一个或多个已就绪状态的知识库</p>
        </div>
      </div>

      <!-- 内容区：左侧表单 60% + 右侧知识库选择面板 40% -->
      <div class="split">
        <!-- ============ 左侧：基本信息表单 ============ -->
        <div class="split-right" style="width:60%">
          <div class="form-card">
            <div class="form-card-title">基本信息</div>

            <!-- 名称：必填，失焦校验 -->
            <div class="form-item">
              <label class="form-label" for="skillName"><span class="required">*</span>名称</label>
              <input class="input" id="skillName" type="text" placeholder="例如：制度查询专家" />
              <div class="form-error" id="nameError" style="display:none">请填写技能名称</div>
            </div>

            <!-- 描述：多行文本域 + 长度限制提示 -->
            <div class="form-item">
              <label class="form-label" for="skillDesc">描述</label>
              <textarea class="textarea" id="skillDesc" placeholder="描述该技能的能力与适用场景"></textarea>
              <div class="form-hint">0 / 200 字</div>
            </div>

            <!-- 内容配置分组 -->
            <div class="form-card-title" style="margin-top:8px">内容配置</div>

            <div class="form-item">
              <label class="form-label" for="promptTpl">提示词模板</label>
              <textarea class="textarea textarea-lg" id="promptTpl" placeholder="定义技能的提示词模板，如：你是一名制度查询专家，请基于以下知识库内容回答问题……"></textarea>
            </div>

            <!-- 模型参数 + 上下文长度 -->
            <div class="form-row">
              <div class="form-item">
                <label class="form-label" for="modelParam">模型参数</label>
                <select class="select" id="modelParam">
                  <option>温度 0.3（精确）</option>
                  <option>温度 0.7（平衡）</option>
                  <option>温度 1.0（发散）</option>
                </select>
              </div>
              <div class="form-item">
                <label class="form-label" for="contextLen">上下文长度</label>
                <input class="input" id="contextLen" type="number" value="4096" min="512" step="512" />
              </div>
            </div>
          </div>

          <!-- 底部操作按钮 -->
          <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:20px">
            <button class="btn btn-secondary">取消</button>
            <button class="btn btn-secondary">保存草稿</button>
            <button class="btn btn-primary" id="saveSkillBtn">保存</button>
          </div>
        </div>

        <!-- ============ 右侧：关联知识库选择面板 ============ -->
        <div class="split-left" style="width:40%">
          <div class="form-card">
            <div class="form-card-title">
              关联知识库
              <span class="tag tag-blue" style="float:right">已选 <b id="selectedCount">1</b> / 8</span>
            </div>

            <!-- 本地模糊过滤 -->
            <div class="search-box" style="margin-bottom:14px">
              <span class="icon">🔍</span>
              <input class="input" type="text" id="kbSearch" placeholder="搜索知识库名称" style="width:100%" />
            </div>

            <!-- 知识库多选列表：仅 READY 可勾选 -->
            <div style="display:flex; flex-direction:column; gap:10px">
              <div class="kb-select-card selected" data-kb="产品手册 v2">
                <span class="round-icon round-icon-blue">产</span>
                <div style="flex:1; min-width:0">
                  <div class="td-name">产品手册 v2</div>
                  <span class="tag tag-green">已就绪</span>
                </div>
                <span class="check-box"></span>
              </div>
              <div class="kb-select-card" data-kb="合规制度库">
                <span class="round-icon round-icon-purple">合</span>
                <div style="flex:1; min-width:0">
                  <div class="td-name">合规制度库</div>
                  <span class="tag tag-green">已就绪</span>
                </div>
                <span class="check-box"></span>
              </div>
              <div class="kb-select-card" data-kb="授信指引">
                <span class="round-icon round-icon-teal">授</span>
                <div style="flex:1; min-width:0">
                  <div class="td-name">授信指引</div>
                  <span class="tag tag-green">已就绪</span>
                </div>
                <span class="check-box"></span>
              </div>
              <!-- 非 READY 状态：禁用态 -->
              <div class="kb-select-card disabled" title="仅已就绪状态知识库可关联">
                <span class="round-icon round-icon-blue">客</span>
                <div style="flex:1; min-width:0">
                  <div class="td-name">客户营销话术</div>
                  <span class="tag tag-blue"><i class="spinner"></i>处理中</span>
                </div>
                <span class="check-box"></span>
              </div>
              <div class="kb-select-card disabled" title="向量化失败，处理完成后才可关联">
                <span class="round-icon round-icon-purple">制</span>
                <div style="flex:1; min-width:0">
                  <div class="td-name">授信风险指引</div>
                  <span class="tag tag-red">失败</span>
                </div>
                <span class="check-box"></span>
              </div>
            </div>

            <p class="form-hint" style="margin-top:12px">仅 <b>已就绪</b> 状态的知识库可以被技能选择。</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- 操作结果 Toast -->
  <div class="toast" id="toast"></div>

  <script>
    /* 原型交互：知识库卡片多选（整行点击切换勾选，禁用态不可选） */
    document.querySelectorAll('.kb-select-card').forEach(function (card) {
      card.addEventListener('click', function () {
        if (card.classList.contains('disabled')) {
          showToast('仅已就绪状态知识库可关联', 'error');
          return;
        }
        card.classList.toggle('selected');
        updateCount();
      });
    });

    /* 原型交互：已选数量实时更新 */
    function updateCount() {
      var n = document.querySelectorAll('.kb-select-card.selected').length;
      document.getElementById('selectedCount').textContent = n;
    }

    /* 原型交互：保存按钮失焦校验（仅演示） */
    document.getElementById('saveSkillBtn').addEventListener('click', function () {
      var name = document.getElementById('skillName').value.trim();
      var err = document.getElementById('nameError');
      if (!name) { err.style.display = 'block'; return; }
      err.style.display = 'none';
      showToast('技能保存成功（原型演示）', 'success');
    });

    /* 原型交互：名称失焦即校验 */
    document.getElementById('skillName').addEventListener('blur', function () {
      document.getElementById('nameError').style.display = this.value.trim() ? 'none' : 'block';
    });

    /* 原型交互：Toast 提示 */
    function showToast(msg, type) {
      var toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'toast show ' + (type || 'success');
      setTimeout(function () { toast.classList.remove('show'); }, 3000);
    }
  </script>
</body>
</html>
